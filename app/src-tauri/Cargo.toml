[package]
name = "kelp"
version = "0.1.2"
description = "A fast Mac app for browsing and transferring files across S3, R2 and Hetzner"
authors = ["Ozan Gokberk"]
edition = "2024"
# Tauri 2.12 needs Rust 1.90 or newer (`rustup update stable`). Cargo picks crate versions that
# support this, so raising it is how the Rust crates stay in step with the npm @tauri-apps packages.
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the library name different from the binary name (a Cargo quirk on Windows).
name = "kelp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.92"
aws-sdk-s3 = "1.122.0"
aws-smithy-types = { version = "1.4.3", features = ["http-body-1-x"] }
bytes = "1"
http-body = "1"
keyring = { version = "3", features = ["apple-native"] }
security-framework = { version = "3", features = ["OSX_10_15"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

# Smaller, faster release builds: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "test-util"] }
