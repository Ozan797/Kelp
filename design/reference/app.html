    <style>
      body { margin: 0; font: 400 15px/1.6 var(--font-body); }
      .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(640px, 1fr)); }
      .panel { padding: var(--space-6); background: var(--bg); color: var(--text); }
      .panel > h1 { font: 700 var(--text-2xl) / 1.1 var(--font-display); margin: 0 0 var(--space-5); }
      .sheet-doc h2 { font: 700 var(--text-lg) / 1.1 var(--font-display); margin: var(--space-7) 0 var(--space-2); }
      .sheet-doc p.note { margin: 0 0 var(--space-4); color: var(--text-muted); font-size: var(--text-sm); }
      .win { display: grid; grid-template-columns: 72px 190px 1fr; height: 400px; width: 100%; border-radius: 11px; overflow: hidden; font: 12px/1.35 var(--font-ui); color: var(--text); background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow-lg); margin-bottom: var(--space-3); position: relative; }
      .win * { box-sizing: border-box; }
      .win.mini { height: 300px; }
      .win.solo { grid-template-columns: 72px 1fr; }
      .rail { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 9px; }
      .lights { display: flex; gap: 7px; padding: 12px 0 8px; } .lights i { width: 11px; height: 11px; border-radius: 50%; background: var(--danger); } .lights i + i { background: var(--warning); } .lights i + i + i { background: var(--accent); }
      .tile { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-raised); border: 1px solid var(--border); }
      .tile svg { width: 19px; height: 19px; } .hz { color: var(--provider-hetzner); } .r2 { color: var(--provider-r2); } .s3 { color: var(--provider-s3); }
      .tile.on { outline: 2px solid var(--accent); outline-offset: 2px; }
      .tile.add { color: var(--text-muted); border-style: dashed; font-size: 16px; }
      .gear { margin-top: auto; padding-bottom: 12px; color: var(--text-muted); font-size: 15px; }
      .buckets { background: var(--surface); border-right: 1px solid var(--border); padding-top: 34px; }
      .bh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 14px 8px; } .bh span { color: var(--text-muted); font-size: 11px; }
      .bk { display: flex; align-items: center; gap: 8px; margin: 1px 8px; padding: 6px 8px; border-radius: 6px; }
      .bk svg { width: 15px; height: 15px; color: var(--text-muted); }
      .bk.on { background: var(--accent-soft); color: var(--on-accent-soft); font-weight: 600; } .bk.on svg { color: var(--on-accent-soft); }
      .main { display: flex; flex-direction: column; min-width: 0; position: relative; }
      .tb { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-bottom: 1px solid var(--border); }
      .nav { font-size: 18px; width: 18px; text-align: center; } .nav.dim { color: var(--border); }
      .crumbs { color: var(--text-muted); white-space: nowrap; } .crumbs i { font-style: normal; margin: 0 3px; opacity: 0.6; } .crumbs b { color: var(--text); }
      .sp { flex: 1; }
      .filter { width: 150px; padding: 4px 8px; border-radius: 6px; background: var(--surface-raised); border: 1px solid var(--border); color: var(--text-muted); }
      .btn { padding: 4px 10px; border-radius: 6px; background: var(--surface-raised); border: 1px solid var(--border); font-weight: 500; white-space: nowrap; }
      .btn.p { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
      .th, .r { display: grid; grid-template-columns: minmax(0, 1fr) 80px 100px; gap: 10px; padding: 0 14px; align-items: center; }
      .th { height: 26px; color: var(--text-muted); font-size: 11px; font-weight: 600; border-bottom: 1px solid var(--border); }
      .list { position: relative; flex: 1; padding: 3px 6px; overflow: hidden; }
      .r { height: 28px; border-radius: 6px; padding: 0 8px; }
      .r span:not(.n) { color: var(--text-muted); font-variant-numeric: tabular-nums; }
      .n { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
      .ic { width: 16px; height: 16px; flex: none; color: var(--text-muted); } .ic.fo { color: var(--accent); }
      .r.sel { background: var(--accent-soft); } .r.sel .n { color: var(--on-accent-soft); font-weight: 600; }
      .r.focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
      .menu { position: absolute; left: 230px; top: 92px; width: 190px; padding: 5px; border-radius: 9px; background: var(--surface-raised); border: 1px solid var(--border); box-shadow: var(--shadow-md); }
      .menu div { display: flex; justify-content: space-between; align-items: center; padding: 5px 9px; border-radius: 5px; }
      .menu div:first-child { background: var(--accent); color: var(--on-accent); }
      .menu kbd { font: inherit; line-height: inherit; opacity: 0.7; }
      .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }
      .menu .danger { color: var(--danger); }
      .sb { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 14px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 11px; }
      .pill { display: flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: var(--radius-full); background: var(--surface-raised); border: 1px solid var(--border); color: var(--text); }
      .spin { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); }
      .bar { width: 70px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; } .bar i { display: block; width: 64%; height: 100%; background: var(--accent); }
      .empty { flex: 1; display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; padding: 0 30px; }
      .empty h5 { margin: 6px 0 0; font-size: 15px; }
      .empty p { margin: 0 0 6px; max-width: 34ch; color: var(--text-muted); }
      .empty a { color: var(--link); font-size: 11px; }
      .eico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 18px; background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
      .eico.soft { background: var(--accent-soft); color: var(--on-accent-soft); }
      .row2 { display: flex; gap: 8px; }
      .sk { display: block; height: 9px; border-radius: 4px; background: var(--skeleton); }
      .dropzone { position: absolute; inset: 6px; display: grid; place-content: center; justify-items: center; gap: 4px; border: 2px dashed var(--accent); border-radius: 10px; background: var(--bubble-fill); }
      .dropzone b { color: var(--accent); font-size: 14px; } .dropzone span { color: var(--text-muted); }
      .drawer { position: relative; display: flex; flex-direction: column; height: 220px; border-top: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-md); }
      .dh { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 16px; border-bottom: 1px solid var(--border); flex: none; }
      .meta { color: var(--text-muted); font-size: 11px; }
      .x { color: var(--text-muted); font-size: 15px; width: 18px; text-align: center; background: none; border: 0; padding: 0; font-family: inherit; }
      .scroll { overflow: hidden; flex: 1; padding: 4px 0 10px; }
      .grp { display: flex; align-items: center; gap: 6px; padding: 10px 16px 6px; color: var(--text-muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
      .grp em { font-style: normal; padding: 0 6px; border-radius: var(--radius-full); background: var(--surface-raised); border: 1px solid var(--border); letter-spacing: 0; }
      .grp em.bad { color: var(--danger); }
      .car { width: 10px; }
      .it { display: grid; grid-template-columns: 24px minmax(0, 1fr) 150px 70px; gap: 14px; align-items: center; margin: 0 8px; padding: 9px 8px; border-radius: 8px; }
      .it.hov { background: var(--surface-raised); }
      .dir { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--accent-soft); color: var(--on-accent-soft); }
      .dir.err { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
      .tn { display: grid; gap: 2px; min-width: 0; } .tn b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tn small { color: var(--text-muted); font-size: 11px; }
      .pbar { display: block; height: 3px; margin-top: 5px; border-radius: 2px; background: var(--border); overflow: hidden; }
      .pbar i { display: block; height: 100%; background: var(--accent); }
      .st { color: var(--text-muted); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
      .st.err { color: var(--danger); }
      .ac { justify-self: end; color: var(--text-muted); }
      .stage { position: relative; height: 440px; border-radius: 10px; overflow: hidden; background: var(--bg); border: 1px solid var(--border); font: 12px/1.4 var(--font-ui); color: var(--text); margin-bottom: var(--space-3); }
      .stage * { box-sizing: border-box; }
      .dimmer { position: absolute; inset: 0; background: var(--scrim); }
      .sheet { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 400px; background: var(--surface-raised); border: 1px solid var(--border); border-top: 0; border-radius: 0 0 12px 12px; box-shadow: var(--shadow-lg); padding: 18px 20px 16px; }
      .sheet h4 { margin: 0 0 4px; font-size: 15px; }
      .sheet p.s { margin: 0 0 14px; color: var(--text-muted); }
      .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
      .seg div { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-raised); font-weight: 600; color: var(--text); }
      .seg div.on { border-color: var(--accent); background: var(--accent-soft); color: var(--on-accent-soft); }
      .seg svg { width: 16px; height: 16px; }
      .seg .hz svg { color: var(--provider-hetzner); } .seg .r2 svg { color: var(--provider-r2); } .seg .s3 svg { color: var(--provider-s3); }
      .f { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
      .f label { color: var(--text-muted); text-align: right; }
      .in { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
      .hint { grid-column: 2; margin-top: -4px; color: var(--text-muted); font-size: 11px; }
      .ok { display: flex; align-items: center; gap: 6px; margin: 10px 0 0 118px; color: var(--on-accent-soft); font-weight: 600; }
      .acts { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
      .acts span { display: flex; gap: 8px; }
      .b { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-raised); font-weight: 500; }
      .b.p { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
      .lnk { color: var(--link); }
    </style>
