name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "design/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      require-release:
        type: boolean
        default: false
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: true
      NETLIFY_SITE_ID:
        required: true

concurrency:
  group: website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Require a release in the build
        if: inputs.require-release
        run: |
          if grep -q "Download coming soon" dist/index.html; then
            echo "The site built without a release. Check https://kelp-dl.ozanai.dev/latest.json and run Deploy website again."
            exit 1
          fi
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27.13.0 deploy --dir dist --prod --site "$NETLIFY_SITE_ID" --no-build
