<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08111a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply a saved theme before the first paint (same key as design/theme.ts).
      try {
        var t = localStorage.getItem("kelp-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
      // When a view transition is animating this page in, skip the CSS load-in animations (.enter).
      addEventListener("pagereveal", function (e) {
        if (e.viewTransition) document.documentElement.classList.add("vt-nav");
      });
    </script>
    <style>
      /* Paint the theme's page colour before any CSS loads, so navigation never flashes white
         (in dev the stylesheet arrives via JavaScript). Values mirror --mist-50 and --navy-950. */
      html { background: #f6f8f9; }
      html[data-theme="dark"] { background: #08111a; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background: #08111a; }
      }
    </style>
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
